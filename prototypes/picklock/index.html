<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1007">
<title>Picklock Timing Lock</title>
<style>
  :root {
    /* wood + brass palette */
    --bg-void: #1b1007;
    --bg-surface: #2a190b;
    --bg-raised: #3a2411;
    --accent: #d9ac4f;          /* brass */
    --brass-hi: #f6dc8e;
    --brass: #c8963a;
    --brass-lo: #7a5518;
    --text-primary: #f0e2bd;
    --text-muted: #b9a57a;
    --border-subtle: #6b4f22;
    --good: #8fdcb5;            /* verdigris: a pin that is set */
    --perfect: #ffe493;         /* polished gold: a perfect set */
    --bad: #ef7a5c;             /* rust */
    color-scheme: dark;
    --font-ui: Geist, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-display: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg-void); color: var(--text-primary);
    font-family: var(--font-ui);
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #wood { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; background: #2a1809; }
  .app {
    position: relative; z-index: 1;
    height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    max-width: 720px; margin: 0 auto;
  }

  /* ---- HUD ---- */
  .hud { padding: 12px 16px 4px; display: flex; flex-direction: column; gap: 10px; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .levels button {
    background: linear-gradient(#4a3015, #2c1b0b); color: var(--text-primary);
    border: 1px solid var(--border-subtle); border-radius: 8px;
    padding: 8px 4px; font: inherit; font-size: 13px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    text-shadow: 0 1px 0 rgba(0,0,0,.6);
    box-shadow: inset 0 1px 0 rgba(255,225,160,.18), 0 2px 4px rgba(0,0,0,.5);
  }
  .levels button small { font-size: 10px; opacity: .75; }
  .levels button[aria-pressed="true"] {
    background: linear-gradient(#f3d584, #c8963a 55%, #a67a24); color: #2a1806;
    border-color: #6e4f14; text-shadow: 0 1px 0 rgba(255,240,200,.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 2px 5px rgba(0,0,0,.5);
  }
  .stats {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px;
    padding: 6px 12px; border-radius: 12px;
    background: rgba(18,10,4,.72); border: 1px solid rgba(200,150,58,.35);
    box-shadow: inset 0 1px 0 rgba(255,225,160,.12), 0 4px 10px rgba(0,0,0,.4);
  }
  .pins, .picks { display: flex; gap: 8px; align-items: center; }
  .pin {
    width: 14px; height: 22px; border-radius: 3px 3px 7px 7px;
    background: linear-gradient(90deg, #1a0f06, #2c1b0b); border: 1px solid #5a4020;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.7);
    transition: transform .15s, background .15s, box-shadow .15s;
  }
  .pin.on {
    background: linear-gradient(90deg, #4f9f7b, #a8e8c8 45%, #3d8566); border-color: #2e6b50;
    transform: translateY(-4px);
    box-shadow: 0 3px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .pin.perfect {
    background: linear-gradient(90deg, #c9a042, #fff1b5 45%, #b08a2c); border-color: #7a5a14;
    box-shadow: 0 0 12px rgba(255,220,120,.55), 0 3px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .picks svg { width: 24px; height: 24px; color: #d8dce2; filter: drop-shadow(0 1px 1px rgba(0,0,0,.7)); transition: opacity .2s, color .2s; }
  .picks svg.gone { opacity: .3; color: var(--bad); }
  .mute {
    background: linear-gradient(#4a3015, #2c1b0b); border: 1px solid var(--border-subtle); color: var(--text-primary);
    border-radius: 8px; font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,225,160,.18);
  }
  .toast {
    height: 22px; text-align: center; font-size: 14px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text-primary); opacity: 0;
    text-shadow: 0 1px 2px #000, 0 0 10px rgba(0,0,0,.9);
  }
  .toast.show { animation: toast .7s ease-out; }
  .toast.good { color: var(--good); } .toast.perfect { color: var(--perfect); } .toast.bad { color: #ff9a7e; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; } }

  /* ---- Stage ---- */
  .stage {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    display: grid; place-items: center; padding: 8px;
    touch-action: none;   /* no scroll / zoom / double-tap while playing */
  }
  canvas.lock { display: block; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px;
    background: rgba(14,8,3,.42);
  }
  .overlay.show { display: flex; }
  .overlay .card {
    display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    width: min(340px, 100%); padding: 22px 22px 20px; border-radius: 16px;
    background: linear-gradient(rgba(48,30,14,.95), rgba(24,14,6,.95));
    border: 1px solid rgba(200,150,58,.5);
    box-shadow: inset 0 1px 0 rgba(255,225,160,.15), 0 14px 34px rgba(0,0,0,.6);
  }
  .overlay h1 {
    margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: .03em;
    color: var(--brass-hi); text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 18px rgba(217,172,79,.25);
  }
  .overlay p { margin: 0; max-width: 34ch; color: #d6c395; line-height: 1.45; font-size: 15px; }
  .overlay .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; width: min(240px, 100%); }
  .btn {
    font: inherit; font-size: 16px; font-weight: 700; padding: 14px 20px; border-radius: 10px; min-height: 48px; cursor: pointer;
    border: 1px solid #6e4f14; color: #2a1806; text-shadow: 0 1px 0 rgba(255,240,200,.5);
    background: linear-gradient(#f3d584, #c8963a 55%, #a67a24);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 2px 0 #5a3d0c, 0 6px 12px rgba(0,0,0,.45);
  }
  .btn:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 1px 0 #5a3d0c, 0 3px 8px rgba(0,0,0,.45); }
  .btn.ghost {
    background: rgba(42,25,11,.7); color: var(--text-primary); border-color: var(--border-subtle);
    text-shadow: none; box-shadow: inset 0 1px 0 rgba(255,225,160,.15);
  }
  .btn:focus-visible, .levels button:focus-visible, .mute:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }

  .hint { padding: 4px 16px 14px; text-align: center; font-size: 12px; color: #d9c79c; text-shadow: 0 1px 2px #000, 0 0 8px rgba(0,0,0,.8); }
</style>
</head>
<body>
<canvas id="wood" aria-hidden="true"></canvas>
<main class="app">
  <header class="hud">
    <div class="levels" id="levels" role="group" aria-label="Lock difficulty"></div>
    <div class="stats">
      <div class="pins" id="pins" aria-label="Tumblers set"></div>
      <div class="picks" id="picks" aria-label="Picks remaining"></div>
      <button class="mute" id="mute" aria-pressed="false">Sound on</button>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
  </header>

  <section class="stage" id="stage">
    <canvas class="lock" id="c" role="img" aria-label="Brass lock with a rotating needle. Tap when the needle crosses the glowing notch."></canvas>
    <div class="overlay" id="overlay"></div>
  </section>

  <footer class="hint">Tap anywhere (or press Space) when the needle crosses the glowing notch</footer>
</main>

<script>
(() => {
'use strict';

/* =========================================================
 *  Config - tweak these to tune the feel
 * ========================================================= */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

const LEVELS = [
  { name: 'Novice', pins: 3, half: 22, speed: 110 },   // half = notch half-width (deg), speed = deg/s
  { name: 'Adept',  pins: 4, half: 18, speed: 130 },
  { name: 'Expert', pins: 5, half: 14, speed: 150 },
  { name: 'Master', pins: 6, half: 11, speed: 170 },
];
const PICKS            = 3;     // misses allowed before the pick snaps
const SPEEDUP_PER_PIN  = 0.08;  // each set pin speeds the needle up by this fraction
const PERFECT_FRACTION = 0.30;  // inner fraction of the notch that counts as "perfect"
const MISS_LOCKOUT_MS  = 250;   // brief lockout after a miss to discourage mashing
const MIN_TARGET_GAP   = 70 * DEG; // new notch is at least this far from the needle
const SHRINK_FACTOR    = 0.90;  // a non-perfect hit makes the next notch 10% smaller (compounds)
const MIN_HALF_DEG     = 3;     // floor so a notch can never shrink to something unhittable
const TICK_EVERY_DEG   = 12;    // quiet ratchet tick as the needle sweeps (0 = off)

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================
 *  Helpers
 * ========================================================= */
const $ = id => document.getElementById(id);
const wrap = a => { a %= TAU; return a < 0 ? a + TAU : a; };
const angDiff = (a, b) => { let d = wrap(a - b); if (d > Math.PI) d -= TAU; return d; }; // signed, (-pi, pi]
const rand = (a, b) => a + Math.random() * (b - a);
// Seeded PRNG so the wood and the brushed metal look the same on every resize.
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* =========================================================
 *  Audio - everything is synthesised from physical building blocks:
 *    modal()  ringing metal: a few inharmonic partials with their own decay times
 *    burst()  filtered-noise transients: clicks, scrapes, grinding, cracks
 *    thump()  a pitch-dropping sine: mass hitting something
 *  and run through a short convolution "casing" reverb so hits have a body.
 * ========================================================= */
let ac = null, master = null, verb = null, noiseBuf = null, muted = false;

function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.9;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.12;
      master.connect(comp); comp.connect(ac.destination);

      verb = ac.createConvolver();
      const len = Math.floor(ac.sampleRate * 0.35), ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
      }
      verb.buffer = ir; verb.connect(master);

      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    } catch { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
const send = (node, wet) => {
  node.connect(master);
  if (wet > 0) { const s = ac.createGain(); s.gain.value = wet; node.connect(s); s.connect(verb); }
};
// partials: [[frequency ratio, decay seconds, amplitude], ...]
function modal(f0, partials, vol, delay = 0, wet = 0.2) {
  const c = audio(); if (!c || muted) return;
  const t0 = c.currentTime + delay, bus = c.createGain();
  bus.gain.value = vol; send(bus, wet);
  for (const [ratio, decay, amp] of partials) {
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = f0 * ratio;
    g.gain.setValueAtTime(amp, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
    o.connect(g); g.connect(bus); o.start(t0); o.stop(t0 + decay + 0.02);
  }
}
function burst({ dur = 0.03, vol = 0.3, type = 'highpass', freq = 3000, q = 0.7, sweepTo = 0, attack = 0.001, delay = 0, wet = 0.15 }) {
  const c = audio(); if (!c || muted) return;
  const t0 = c.currentTime + delay;
  const src = c.createBufferSource(); src.buffer = noiseBuf;
  const f = c.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t0);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); send(g, wet);
  src.start(t0, Math.random() * 0.4); src.stop(t0 + dur + 0.02);
}
function thump(freq, dur, vol, delay = 0) {
  const c = audio(); if (!c || muted) return;
  const t0 = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(freq, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.45), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); send(g, 0.08); o.start(t0); o.stop(t0 + dur + 0.02);
}
const buzz = pattern => { if (!muted && navigator.vibrate) { try { navigator.vibrate(pattern); } catch {} } };

const sfx = {
  // quiet ratchet click as the needle sweeps; only plays once audio has been unlocked
  tick() {
    if (!ac || muted || ac.state !== 'running') return;
    burst({ dur: 0.008, vol: 0.05 + Math.random() * 0.02, type: 'bandpass', freq: 3800 + Math.random() * 900, q: 3, wet: 0 });
  },
  // a pin lifting and seating: tip click, short metal ping, thunk, settle clack
  hit(n, perfect) {
    const f = 1700 * (1 + 0.05 * n);
    burst({ dur: 0.012, vol: 0.35, type: 'highpass', freq: 3500, wet: 0.1 });
    modal(f, [[1, 0.05, 1], [2.76, 0.035, 0.6], [5.4, 0.02, 0.35]], 0.16, 0, 0.2);
    thump(140, 0.06, 0.3, 0.012);
    burst({ dur: 0.02, vol: 0.25, type: 'bandpass', freq: 2200, q: 2, delay: 0.014 });
    if (perfect) {   // the brass rings: longer-lived, brighter inharmonic partials
      modal(f * 1.5, [[1, 0.5, 1], [2.32, 0.32, 0.5], [4.25, 0.2, 0.3], [6.63, 0.12, 0.2]], 0.1, 0.02, 0.35);
      buzz([10, 25, 10]);
    } else buzz(10);
  },
  // mistimed tap: the pick skittering over the pins plus a dull knock
  miss() {
    burst({ dur: 0.09, vol: 0.4, type: 'bandpass', freq: 2800, q: 1.2, sweepTo: 1200 });
    burst({ dur: 0.05, vol: 0.25, type: 'bandpass', freq: 700, q: 1 });
    thump(110, 0.09, 0.35, 0.01);
    burst({ dur: 0.04, vol: 0.18, type: 'bandpass', freq: 3400, q: 2, sweepTo: 1800, delay: 0.07 });
    buzz(40);
  },
  // a pin falling back down: thud, little ping, bounces and a spring rattle
  drop() {
    thump(85, 0.14, 0.5);
    modal(2100, [[1, 0.04, 1], [2.76, 0.03, 0.6]], 0.12);
    [0.05, 0.095, 0.125].forEach((d, i) =>
      burst({ dur: 0.012, vol: 0.2 * (1 - i * 0.3), type: 'highpass', freq: 3000 + i * 500, delay: d }));
    burst({ dur: 0.18, vol: 0.1, type: 'bandpass', freq: 5200, q: 6, sweepTo: 4300, delay: 0.02, wet: 0.3 });
    buzz([25, 35, 25]);
  },
  // the pick breaks: sharp crack, ringing steel, then fragments tinkling away
  snap() {
    burst({ dur: 0.03, vol: 0.6, type: 'highpass', freq: 1800 });
    thump(220, 0.05, 0.3);
    modal(3200, [[1, 0.45, 1], [2.43, 0.3, 0.5], [4.1, 0.18, 0.3], [6.9, 0.1, 0.2]], 0.15, 0.005, 0.4);
    [0.09, 0.15, 0.2, 0.26].forEach(d => modal(2600 + Math.random() * 1800, [[1, 0.08, 1], [2.76, 0.05, 0.5]], 0.07, d));
    buzz([30, 40, 90]);
  },
  // the plug turns (grinding), the bolt throws (clunk + clack), brass rings out
  win() {
    burst({ dur: 0.55, vol: 0.14, type: 'bandpass', freq: 350, q: 3, sweepTo: 900, attack: 0.1, wet: 0.1 });
    thump(65, 0.18, 0.8, 0.55);
    modal(1100, [[1, 0.06, 1], [2.9, 0.04, 0.6]], 0.3, 0.55);
    burst({ dur: 0.02, vol: 0.4, type: 'highpass', freq: 2500, delay: 0.55 });
    burst({ dur: 0.015, vol: 0.25, type: 'highpass', freq: 3000, delay: 0.62 });
    modal(880, [[1, 1.0, 1], [2.32, 0.7, 0.4], [4.25, 0.4, 0.25]], 0.08, 0.6, 0.5);
    buzz([20, 40, 20, 40, 60]);
  },
};

/* =========================================================
 *  Game state
 * ========================================================= */
const S = {
  level: 0, phase: 'ready',          // ready | playing | won | broken
  needle: 0, dir: 1, speed: 0,       // radians, +1 clockwise, rad/s
  target: 0, half: 0,                // radians
  set: [],                           // [{ c, perfect, half }]
  picks: PICKS, perfects: 0,
  plug: 0, plugTarget: 0,            // rotation of the inner cylinder (rad)
  shake: 0, lockout: 0, frameT: performance.now(), tickAcc: 0,
  flash: null, bursts: [], overlayTimer: 0,
};
const cfg = () => LEVELS[S.level];

function newLock() {
  clearTimeout(S.overlayTimer);
  const L = cfg();
  Object.assign(S, {
    phase: 'ready', set: [], picks: PICKS, perfects: 0, dir: 1,
    speed: L.speed * DEG, half: L.half * DEG,
    plug: 0, plugTarget: 0, shake: 0, lockout: 0, tickAcc: 0, flash: null, bursts: [],
  });
  S.needle = rand(0, TAU);
  renderLevels(); renderPins(); renderPicks();
  showOverlay('ready');
}

function placeTarget() {
  let c = 0;
  for (let i = 0; i < 60; i++) {
    c = rand(0, TAU);
    if (Math.abs(angDiff(c, S.needle)) < MIN_TARGET_GAP) continue;
    // set notches can have different widths now, so compare against each one's own half-width
    if (S.set.some(s => Math.abs(angDiff(c, s.c)) < s.half + S.half + 4 * DEG)) continue;
    break;
  }
  S.target = c;
}

// A perfect hit restores the full-size notch; a non-perfect hit shrinks the next one by 10%.
function nextHalf(perfect) {
  return perfect ? cfg().half * DEG : Math.max(MIN_HALF_DEG * DEG, S.half * SHRINK_FACTOR);
}

function start() {
  S.phase = 'playing';
  S.speed = cfg().speed * DEG;
  placeTarget();
  hideOverlay();
}

/* =========================================================
 *  Input -> the one verb of this game: tap
 * ========================================================= */
function tap() {
  const now = performance.now();
  if (S.phase !== 'playing' || now < S.lockout) return;
  audio();

  // The needle has moved on since the last drawn frame - compensate so the tap is judged
  // against where the needle really is *now*.
  const ahead = Math.min(Math.max((now - S.frameT) / 1000, 0), 0.05);
  const needleNow = wrap(S.needle + S.dir * S.speed * ahead);
  const d = Math.abs(angDiff(needleNow, S.target));

  if (d <= S.half) {
    const perfect = d <= S.half * PERFECT_FRACTION;
    const next = nextHalf(perfect);                    // size of the following notch
    const wasShrunk = S.half < cfg().half * DEG - 1e-9;
    S.set.push({ c: S.target, perfect, half: S.half });
    if (perfect) S.perfects++;
    S.bursts.push({ c: S.target, t0: now, perfect, half: S.half });
    sfx.hit(S.set.length, perfect);
    toast(perfect ? (wasShrunk ? 'Perfect · notch reset' : 'Perfect')
                  : (next < S.half - 1e-9 ? 'Set · notch shrinks' : 'Set'),
          perfect ? 'perfect' : 'good');
    renderPins();

    const total = cfg().pins;
    if (S.set.length >= total) {
      S.phase = 'won';
      S.plugTarget = 100 * DEG;
      sfx.win();
      S.overlayTimer = setTimeout(() => showOverlay('won'), 750);
    } else {
      S.plugTarget = (S.set.length / total) * 80 * DEG;
      S.speed = cfg().speed * DEG * (1 + SPEEDUP_PER_PIN * S.set.length);
      S.dir = -S.dir;
      S.half = next;
      placeTarget();
    }
  } else {
    S.picks--;
    S.lockout = now + MISS_LOCKOUT_MS;
    S.flash = { t0: now };
    S.shake = 1;
    toast('Missed', 'bad');
    renderPicks();
    if (S.picks <= 0) {
      S.phase = 'broken';
      sfx.snap();
      S.shake = 1.6;
      S.overlayTimer = setTimeout(() => showOverlay('broken'), 600);
    } else {
      sfx.miss();
    }
  }
}

// The needle left the notch without a tap: the most recently set pin drops back down.
// The notch stays where it is, so every further lap past it costs another pin.
function overshoot(now) {
  const dropped = S.set.pop();
  if (!dropped) return;
  if (dropped.perfect) S.perfects--;
  S.plugTarget = (S.set.length / cfg().pins) * 80 * DEG;
  S.speed = cfg().speed * DEG * (1 + SPEEDUP_PER_PIN * S.set.length);
  S.flash = { t0: now };
  S.shake = Math.max(S.shake, 0.6);
  sfx.drop();
  toast('Pin dropped', 'bad');
  renderPins();
}

const stage = $('stage');
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.overlay')) return;
  e.preventDefault();
  tap();
});
window.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && S.phase === 'playing') {
    e.preventDefault();
    if (!e.repeat) tap();
  }
});

/* =========================================================
 *  HUD / overlay DOM
 * ========================================================= */
const PICK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21 15 9c1.2-2.8 4.2-2.8 5.5-.5"/></svg>';

function renderLevels() {
  $('levels').innerHTML = LEVELS.map((l, i) =>
    `<button type="button" data-level="${i}" aria-pressed="${i === S.level}">${l.name}<small>${l.pins} pins</small></button>`).join('');
}
function renderPins() {
  $('pins').innerHTML = Array.from({ length: cfg().pins }, (_, i) => {
    const s = S.set[i];
    return `<i class="pin${s ? ' on' : ''}${s && s.perfect ? ' perfect' : ''}"></i>`;
  }).join('');
}
function renderPicks() {
  $('picks').innerHTML = Array.from({ length: PICKS }, (_, i) =>
    PICK_SVG.replace('<svg', `<svg class="${i >= S.picks ? 'gone' : ''}"`)).join('');
}
const toastEl = $('toast');
function toast(msg, kind) {
  toastEl.className = 'toast ' + kind;
  toastEl.textContent = msg;
  void toastEl.offsetWidth;            // restart the CSS animation
  toastEl.classList.add('show');
}

const overlay = $('overlay');
function showOverlay(kind) {
  const L = cfg();
  const lastLevel = S.level === LEVELS.length - 1;
  const views = {
    ready:  ['Pick the lock', `Tap when the needle crosses the glowing notch. Set all ${L.pins} tumblers before your picks snap. A mistimed tap costs a pick. A non-perfect hit shrinks the next notch by 10%, and letting the needle slip past the notch drops your last pin.`,
             [['start', 'Start', '']]],
    won:    ['Unlocked', `${S.picks} of ${PICKS} picks left${S.perfects ? ` · ${S.perfects} perfect` : ''}.`,
             [['next', lastLevel ? 'Another lock' : 'Next lock', ''], ['again', 'Replay this lock', 'ghost']]],
    broken: ['Pick snapped', `${S.set.length} of ${L.pins} tumblers were set.`,
             [['again', 'Try again', '']]],
  };
  const [title, body, btns] = views[kind];
  overlay.innerHTML = `<div class="card"><h1>${title}</h1><p>${body}</p><div class="btns">${
    btns.map(([a, label, cls]) => `<button class="btn ${cls}" data-action="${a}">${label}</button>`).join('')}</div></div>`;
  overlay.classList.add('show');
  overlay.querySelector('button')?.focus({ preventScroll: true });
}
function hideOverlay() { overlay.classList.remove('show'); document.activeElement?.blur?.(); }

overlay.addEventListener('click', e => {
  const a = e.target.closest('button')?.dataset.action;
  if (!a) return;
  audio();                                   // first user gesture unlocks Web Audio
  if (a === 'next' && S.level < LEVELS.length - 1) S.level++;
  newLock(); start();
});
$('levels').addEventListener('click', e => {
  const b = e.target.closest('button[data-level]');
  if (!b) return;
  S.level = +b.dataset.level; newLock();
});
$('mute').addEventListener('click', e => {
  muted = !muted;
  e.currentTarget.textContent = muted ? 'Sound off' : 'Sound on';
  e.currentTarget.setAttribute('aria-pressed', muted);
  if (!muted) audio();
});

/* =========================================================
 *  Wood background - planks with grain, knots and butt joints, painted once per resize
 * ========================================================= */
const woodCv = $('wood');

function paintWood() {
  const w = woodCv.clientWidth || innerWidth, h = woodCv.clientHeight || innerHeight;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  woodCv.width = Math.round(w * d); woodCv.height = Math.round(h * d);
  const x = woodCv.getContext('2d');
  x.setTransform(d, 0, 0, d, 0, 0);
  const rnd = mulberry32(1337);
  const plankH = Math.max(70, Math.round(h / 9));

  for (let y = 0; y < h;) {
    const ph = plankH * (0.85 + rnd() * 0.3);
    const hue = 25 + rnd() * 9, sat = 42 + rnd() * 14, lit = 17 + rnd() * 9;
    x.save();
    x.beginPath(); x.rect(0, y, w, ph); x.clip();

    const g = x.createLinearGradient(0, y, 0, y + ph);
    g.addColorStop(0, `hsl(${hue} ${sat}% ${lit + 3}%)`);
    g.addColorStop(0.5, `hsl(${hue} ${sat}% ${lit}%)`);
    g.addColorStop(1, `hsl(${hue} ${sat}% ${lit - 2}%)`);
    x.fillStyle = g; x.fillRect(0, y, w, ph);

    const knots = [];
    if (rnd() < 0.45) knots.push({ x: rnd() * w, y: y + ph * (0.3 + 0.4 * rnd()), sx: 18 + rnd() * 22, sy: 6 + rnd() * 8 });

    // grain: long wavy strokes, bent away from knots
    const lines = Math.round(ph / 1.5);
    x.lineJoin = 'round';
    for (let i = 0; i < lines; i++) {
      const ly = y + (i + rnd()) * ph / lines;
      x.strokeStyle = rnd() < 0.6 ? `rgba(20,9,2,${0.05 + rnd() * 0.12})` : `rgba(255,205,140,${0.02 + rnd() * 0.06})`;
      x.lineWidth = 0.5 + rnd() * 1.6;
      const f1 = 0.004 + rnd() * 0.006, p1 = rnd() * TAU, a1 = 0.8 + rnd() * 2.2;
      const f2 = 0.017 + rnd() * 0.02, p2 = rnd() * TAU, a2 = 0.3 + rnd() * 0.8;
      x.beginPath();
      for (let px = -4; px <= w + 4; px += 6) {
        let dy = Math.sin(px * f1 + p1) * a1 + Math.sin(px * f2 + p2) * a2;
        for (const k of knots) {
          const ddx = (px - k.x) / k.sx, ddy = (ly - k.y) / (k.sy * 2.2);
          dy += Math.sign(ly - k.y) * 7 * Math.exp(-ddx * ddx * 0.5) * Math.exp(-ddy * ddy * 0.5);
        }
        px === -4 ? x.moveTo(px, ly + dy) : x.lineTo(px, ly + dy);
      }
      x.stroke();
    }
    for (const k of knots) {
      for (let r = 5; r >= 1; r--) {
        x.strokeStyle = `rgba(20,9,2,${0.42 - r * 0.06})`; x.lineWidth = 1;
        x.beginPath(); x.ellipse(k.x, k.y, k.sx * 0.12 * r, k.sy * 0.3 * r, 0, 0, TAU); x.stroke();
      }
      x.fillStyle = 'rgba(25,10,2,.55)'; x.beginPath(); x.ellipse(k.x, k.y, k.sx * 0.1, k.sy * 0.26, 0, 0, TAU); x.fill();
    }

    // butt joint between boards, then the gap and a lit top edge for this plank
    if (rnd() < 0.7) {
      const jx = rnd() * w;
      x.fillStyle = 'rgba(8,3,0,.85)'; x.fillRect(jx, y, 1.6, ph);
      x.fillStyle = 'rgba(255,210,150,.10)'; x.fillRect(jx + 1.6, y, 1, ph);
    }
    x.fillStyle = 'rgba(255,210,150,.12)'; x.fillRect(0, y, w, 1);
    x.fillStyle = 'rgba(8,3,0,.85)'; x.fillRect(0, y + ph - 1.6, w, 1.6);
    x.restore();
    y += ph;
  }

  // fine speckle + vignette so the lock sits in a pool of light
  for (let i = 0; i < w * h / 90; i++) {
    x.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,.05)' : 'rgba(255,220,170,.03)';
    x.fillRect(rnd() * w, rnd() * h, 1.2, 1.2);
  }
  const vg = x.createRadialGradient(w / 2, h * 0.55, Math.min(w, h) * 0.25, w / 2, h * 0.55, Math.max(w, h) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
  x.fillStyle = vg; x.fillRect(0, 0, w, h);
}
let woodTimer = 0;
window.addEventListener('resize', () => { clearTimeout(woodTimer); woodTimer = setTimeout(paintWood, 120); });

/* =========================================================
 *  Lock rendering
 *    buildStatic()  the metalwork that never moves, drawn once per resize
 *    draw()         notches, rotating plug, needle, effects - every frame
 * ========================================================= */
const canvas = $('c');
const ctx = canvas.getContext('2d');
const staticCv = document.createElement('canvas');
let size = 300, dpr = 1, unit = 130;     // unit = lock radius in CSS px

const BRASS = [[0, '#8a6420'], [.1, '#e9c46c'], [.2, '#a67c26'], [.34, '#5f4012'], [.46, '#a07424'],
               [.58, '#f7de92'], [.7, '#b4872c'], [.84, '#5a3d10'], [1, '#8a6420']];
const BRONZE = [[0, '#6f4d17'], [.12, '#c79a3e'], [.25, '#80591a'], [.4, '#4a300c'], [.52, '#86601c'],
                [.64, '#d8b055'], [.78, '#7b5517'], [.9, '#47300c'], [1, '#6f4d17']];

function conic(x, angle, stops) {
  let g;
  if (x.createConicGradient) g = x.createConicGradient(angle, 0, 0);
  else g = x.createLinearGradient(-1, -1, 1, 1);          // older browsers: plain diagonal sheen
  for (const [o, c] of stops) g.addColorStop(o, c);
  return g;
}
function donut(x, r0, r1) { x.beginPath(); x.arc(0, 0, r1, 0, TAU); x.moveTo(r0, 0); x.arc(0, 0, r0, 0, TAU, true); }
// Concentric brushed-metal scratches
function brush(x, r0, r1, n, rnd) {
  for (let i = 0; i < n; i++) {
    const r = r0 + (r1 - r0) * rnd(), a0 = rnd() * TAU;
    x.beginPath(); x.arc(0, 0, r, a0, a0 + 0.4 + rnd() * 3);
    x.lineWidth = 0.0015 + rnd() * 0.002;
    x.strokeStyle = rnd() < 0.5 ? `rgba(255,240,200,${0.04 + rnd() * 0.08})` : `rgba(30,15,0,${0.04 + rnd() * 0.1})`;
    x.stroke();
  }
}
// Edge bevels, light from the top-left. raised: lit top-left, dark bottom-right; recessed: the reverse.
function bevel(x, r, w, raised, a = 0.8) {
  const g = x.createLinearGradient(-r * .75, -r * .75, r * .75, r * .75);
  const lit = `rgba(255,244,205,${a})`, dark = `rgba(30,14,0,${a})`;
  g.addColorStop(0, raised ? lit : dark); g.addColorStop(.45, 'rgba(0,0,0,0)');
  g.addColorStop(.55, 'rgba(0,0,0,0)'); g.addColorStop(1, raised ? dark : lit);
  x.beginPath(); x.arc(0, 0, r, 0, TAU); x.lineWidth = w; x.strokeStyle = g; x.stroke();
}

function buildStatic() {
  staticCv.width = staticCv.height = Math.round(size * dpr);
  const x = staticCv.getContext('2d');
  const rnd = mulberry32(7);
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.translate(size / 2, size / 2); x.scale(unit, unit);

  // Outer brass bezel, casting a shadow on the wood (shadow values are in device pixels)
  x.save();
  x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 18 * dpr; x.shadowOffsetY = 7 * dpr;
  x.beginPath(); x.arc(0, 0, 0.99, 0, TAU); x.fillStyle = conic(x, -0.6, BRASS); x.fill();
  x.restore();
  brush(x, 0.93, 0.99, 60, rnd);
  bevel(x, 0.982, 0.012, true, 0.9);

  // Dial face with engraved ticks
  donut(x, 0.77, 0.93); x.fillStyle = conic(x, 1.7, BRASS); x.fill();
  donut(x, 0.77, 0.93); x.fillStyle = 'rgba(60,35,5,.22)'; x.fill();
  brush(x, 0.77, 0.93, 90, rnd);
  bevel(x, 0.93, 0.008, false, 0.8);
  x.lineCap = 'round';
  for (let i = 0; i < 72; i++) {
    const a = i * 5 * DEG, major = i % 6 === 0, r0 = 0.81, r1 = major ? 0.91 : 0.865;
    const ux = Math.sin(a), uy = -Math.cos(a), o = 0.004;
    x.lineWidth = major ? 0.011 : 0.007;
    x.strokeStyle = 'rgba(255,238,180,.55)';                       // lit lower-right lip of the engraving
    x.beginPath(); x.moveTo(ux * r0 + o, uy * r0 + o); x.lineTo(ux * r1 + o, uy * r1 + o); x.stroke();
    x.strokeStyle = 'rgba(38,20,3,.9)';
    x.beginPath(); x.moveTo(ux * r0, uy * r0); x.lineTo(ux * r1, uy * r1); x.stroke();
  }
  x.lineCap = 'butt';

  // Recessed groove the notches sit in: near-black blued steel
  donut(x, 0.63, 0.77);
  const gg = x.createRadialGradient(0, 0, 0.63, 0, 0, 0.77);
  gg.addColorStop(0, '#070503'); gg.addColorStop(.5, '#1d170f'); gg.addColorStop(1, '#070503');
  x.fillStyle = gg; x.fill();
  bevel(x, 0.768, 0.01, false, 0.7);
  bevel(x, 0.632, 0.01, true, 0.8);

  // Inner brass ring
  donut(x, 0.56, 0.63); x.fillStyle = conic(x, 3.1, BRASS); x.fill();
  brush(x, 0.56, 0.63, 30, rnd);
  bevel(x, 0.558, 0.008, false, 0.8);

  // Plug face: darker bronze, brushed, with a soft highlight from the top-left
  x.beginPath(); x.arc(0, 0, 0.555, 0, TAU); x.fillStyle = conic(x, 2.4, BRONZE); x.fill();
  const hl = x.createRadialGradient(-0.15, -0.2, 0.02, 0, 0, 0.56);
  hl.addColorStop(0, 'rgba(255,240,190,.35)'); hl.addColorStop(.5, 'rgba(0,0,0,0)'); hl.addColorStop(1, 'rgba(0,0,0,.35)');
  x.beginPath(); x.arc(0, 0, 0.555, 0, TAU); x.fillStyle = hl; x.fill();
  brush(x, 0.05, 0.55, 70, rnd);
  bevel(x, 0.47, 0.006, false, 0.5);
}

function resize() {
  const r = stage.getBoundingClientRect();
  size = Math.max(160, Math.floor(Math.min(r.width, r.height) - 16));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  unit = size / 2 * 0.88;                       // leave room around the bezel for its shadow
  canvas.style.width = canvas.style.height = size + 'px';
  canvas.width = canvas.height = Math.round(size * dpr);
  buildStatic();
}
new ResizeObserver(resize).observe(stage);

// Point on circle: theta 0 = top, clockwise.
const arc = (a0, a1, r) => ctx.arc(0, 0, r, a0 - Math.PI / 2, a1 - Math.PI / 2);
const px = (n) => n * dpr;                      // shadowBlur/offset are in device pixels, not user space

const TR = 0.70, NW = 0.115;                    // track radius, notch width

function keyholePath() {
  ctx.beginPath(); ctx.arc(0, -0.06, 0.07, 0, TAU);
  ctx.moveTo(-0.035, -0.02); ctx.lineTo(0.035, -0.02); ctx.lineTo(0.055, 0.2); ctx.lineTo(-0.055, 0.2); ctx.closePath();
}
function screwDome(cx, cy, r, slotAngle) {
  const g = ctx.createRadialGradient(cx - r * .35, cy - r * .4, r * .1, cx, cy, r);
  g.addColorStop(0, '#fbe6a0'); g.addColorStop(.55, '#b88a2c'); g.addColorStop(1, '#4e340c');
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(25,12,0,.85)'; ctx.lineWidth = r * 0.28; ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(slotAngle) * r * .8, cy - Math.sin(slotAngle) * r * .8);
  ctx.lineTo(cx + Math.cos(slotAngle) * r * .8, cy + Math.sin(slotAngle) * r * .8);
  ctx.stroke();
}

function draw(now) {
  const t = now / 1000;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);

  let ox = 0, oy = 0;
  if (S.shake > 0) { const k = reducedMotion ? 0.2 : 1; ox = rand(-1, 1) * S.shake * 5 * k; oy = rand(-1, 1) * S.shake * 5 * k; }
  ctx.drawImage(staticCv, ox, oy, size, size);       // brass bezel, dial, groove, plug face

  ctx.save();
  ctx.translate(size / 2 + ox, size / 2 + oy);
  ctx.scale(unit, unit);                             // from here on, 1 unit = lock radius

  // Notches already set: verdigris, or polished gold for a perfect
  for (const s of S.set) {
    ctx.beginPath(); arc(s.c - s.half, s.c + s.half, TR);
    ctx.lineWidth = NW; ctx.strokeStyle = s.perfect ? 'rgba(255,232,150,.62)' : 'rgba(120,200,160,.45)'; ctx.stroke();
    ctx.beginPath(); arc(s.c - s.half, s.c + s.half, TR - NW * 0.28);
    ctx.lineWidth = NW * 0.22; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.stroke();
  }

  // Active target notch: glowing amber, with a brighter "perfect" core and a centre line
  if (S.phase === 'playing') {
    const pulse = 0.75 + 0.25 * Math.sin(t * 6);
    ctx.save();
    ctx.shadowColor = '#ffb440'; ctx.shadowBlur = px(18 * pulse);
    ctx.beginPath(); arc(S.target - S.half, S.target + S.half, TR);
    ctx.lineWidth = NW; ctx.strokeStyle = `rgba(255,186,64,${0.55 + 0.35 * pulse})`; ctx.stroke();
    ctx.restore();
    ctx.beginPath(); arc(S.target - S.half * PERFECT_FRACTION, S.target + S.half * PERFECT_FRACTION, TR);
    ctx.lineWidth = NW; ctx.strokeStyle = 'rgba(255,244,200,.4)'; ctx.stroke();
    const sx = Math.sin(S.target), cy = -Math.cos(S.target);
    ctx.beginPath(); ctx.moveTo(sx * (TR - NW / 2), cy * (TR - NW / 2)); ctx.lineTo(sx * (TR + NW / 2), cy * (TR + NW / 2));
    ctx.lineWidth = 0.01; ctx.strokeStyle = 'rgba(255,252,235,.95)'; ctx.stroke();
  }

  // Miss / dropped-pin flash: rust red across the groove
  if (S.flash) {
    const age = (now - S.flash.t0) / 300;
    if (age >= 1) S.flash = null;
    else { ctx.beginPath(); ctx.arc(0, 0, TR, 0, TAU); ctx.lineWidth = NW; ctx.strokeStyle = `rgba(239,122,92,${0.45 * (1 - age)})`; ctx.stroke(); }
  }

  // Hit bursts
  S.bursts = S.bursts.filter(b => now - b.t0 < 500);
  for (const b of S.bursts) {
    const age = (now - b.t0) / 500;
    ctx.beginPath(); arc(b.c - b.half * 1.2, b.c + b.half * 1.2, TR + NW / 2 + age * 0.2);
    ctx.lineWidth = 0.02 * (1 - age) + 0.004;
    ctx.strokeStyle = (b.perfect ? 'rgba(255,232,150,' : 'rgba(143,220,181,') + (1 - age) + ')'; ctx.stroke();
  }

  // Plug: the keyhole and screws turn with the cylinder; their lighting stays fixed
  ctx.save();
  ctx.rotate(S.plug);
  const lx = 0.012 * (Math.cos(S.plug) + Math.sin(S.plug)), ly = 0.012 * (Math.cos(S.plug) - Math.sin(S.plug));
  ctx.save(); ctx.translate(-lx, -ly); keyholePath(); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill(); ctx.restore();   // shadowed upper-left wall
  ctx.save(); ctx.translate(lx, ly);   keyholePath(); ctx.fillStyle = 'rgba(255,235,170,.6)'; ctx.fill(); ctx.restore(); // lit lower-right lip
  keyholePath(); ctx.fillStyle = '#0b0704'; ctx.fill();
  for (const a of [45, 135, 225, 315]) screwDome(Math.sin(a * DEG) * 0.4, -Math.cos(a * DEG) * 0.4, 0.034, a * 2 * DEG);
  ctx.restore();

  // Needle trail
  const live = S.phase === 'playing' || S.phase === 'ready';
  if (live) {
    for (let i = 14; i >= 1; i--) {
      const a1 = S.needle - S.dir * (i - 1) * 2.4 * DEG, a0 = S.needle - S.dir * i * 2.4 * DEG;
      ctx.beginPath(); arc(Math.min(a0, a1), Math.max(a0, a1), TR);
      ctx.lineWidth = NW * 0.45; ctx.strokeStyle = `rgba(225,232,245,${0.16 * (1 - i / 15)})`; ctx.stroke();
    }
  }

  // Needle: a polished steel pick with a ball tip, casting a shadow onto the brass
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = px(5); ctx.shadowOffsetX = px(2); ctx.shadowOffsetY = px(3);
  ctx.rotate(S.needle);
  const sg = ctx.createLinearGradient(-0.012, 0, 0.012, 0);
  sg.addColorStop(0, '#8e939b'); sg.addColorStop(.45, '#f4f6f8'); sg.addColorStop(1, '#6c7078');
  ctx.beginPath(); ctx.moveTo(-0.012, -0.46); ctx.lineTo(0.012, -0.46); ctx.lineTo(0.007, -0.80); ctx.lineTo(-0.007, -0.80); ctx.closePath();
  ctx.fillStyle = sg; ctx.fill();
  const bg = ctx.createRadialGradient(-0.012, -TR - 0.012, 0.004, 0, -TR, 0.038);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(.45, '#aab0b8'); bg.addColorStop(1, '#4a4f57');
  ctx.beginPath(); ctx.arc(0, -TR, 0.036, 0, TAU); ctx.fillStyle = bg; ctx.fill();
  ctx.restore();

  ctx.restore();
}

/* =========================================================
 *  Main loop
 * ========================================================= */
function frame(now) {
  const dt = Math.max(0, Math.min((now - S.frameT) / 1000, 0.05));
  S.frameT = now;

  if (S.phase === 'playing') {
    const step = S.speed * dt;
    // Distance the needle still has to travel (in its direction) to reach the notch's far edge.
    // Sweep-tested, so it still registers if a long frame skips right over a narrow notch.
    const toExit = wrap(S.dir * (S.target + S.dir * S.half - S.needle));
    S.needle = wrap(S.needle + S.dir * step);
    if (toExit > 0 && toExit <= step) overshoot(now);

    if (TICK_EVERY_DEG) {
      S.tickAcc += step;
      if (S.tickAcc >= TICK_EVERY_DEG * DEG) { S.tickAcc %= TICK_EVERY_DEG * DEG; sfx.tick(); }
    }
  } else if (S.phase === 'ready') S.needle = wrap(S.needle + 50 * DEG * dt);

  S.plug += (S.plugTarget - S.plug) * (1 - Math.exp(-dt * 7));
  S.shake = Math.max(0, S.shake - dt * 4);

  draw(now);
  requestAnimationFrame(frame);
}

// Test / debug hook for the prototype.
window.__picklock = { S, tap, LEVELS, sfx, audioNodes: () => ({ ac, master }) };

renderLevels();
newLock();
paintWood();
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
